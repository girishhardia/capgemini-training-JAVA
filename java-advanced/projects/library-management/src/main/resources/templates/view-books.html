<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Books - Library Management</title>

</head>
<body>
    <div class="navbar">
        <span>Library Management System</span>
        <div>
            <a th:href="@{/dashboard}">Dashboard</a>
            <a th:href="@{/books/add}">Add Book</a>
            <a th:href="@{/login}">Logout</a>
        </div>
    </div>
    <div class="container">
        <h2>Available Books</h2>
        <div style="text-align: right;">
            <a th:href="@{/books/add}" class="btn btn-add">Add New Book</a>
        </div>
        <table th:if="${not #lists.isEmpty(books)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}"></td>
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${#numbers.formatCurrency(book.price)}"></td>
                    <td class="actions">
                        <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-view">Details</a>
                        <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-delete">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(books)}" style="text-align:center; color:#666; margin-top:2rem;">No books available in the library.</p>
    </div>
</body>
</html>
