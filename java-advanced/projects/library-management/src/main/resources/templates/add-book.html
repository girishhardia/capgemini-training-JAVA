<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book - Library Management</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .navbar { background-color: #333; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; margin-left: 1rem; }
        .container { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 4rem); padding: 1rem; }
        .form-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #333; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .error { color: #d9534f; font-size: 0.875rem; margin-top: 0.25rem; }
        button { width: 100%; padding: 0.75rem; background-color: #5cb85c; border: none; border-radius: 4px; color: white; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
        button:hover { background-color: #4cae4c; }
    </style>
</head>
<body>
    <div class="navbar">
        <span>Library Management System</span>
        <div>
            <a th:href="@{/dashboard}">Dashboard</a>
            <a th:href="@{/books}">View Books</a>
            <a th:href="@{/login}">Logout</a>
        </div>
    </div>
    <div class="container">
        <div class="form-card">
            <h2>Add New Book</h2>
            <form th:action="@{/books/add}" th:object="${book}" method="post">
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" th:field="*{title}" />
                    <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>
                <div class="form-group">
                    <label>Author:</label>
                    <input type="text" th:field="*{author}" />
                    <div class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
                </div>
                <div class="form-group">
                    <label>Price:</label>
                    <input type="number" step="0.01" th:field="*{price}" />
                    <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
                <button type="submit">Add Book</button>
            </form>
        </div>
    </div>
</body>
</html>
