<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="container" style="text-align: center; margin-top: 10vh;">
        <h1 style="color: var(--danger);">Oops!</h1>
        <p th:text="${errorMessage != null ? errorMessage : 'Something went wrong. Please try again later.'}"></p>
        <a th:href="@{/home}" class="btn">Back to Home</a>
    </div>
</body>
</html>
