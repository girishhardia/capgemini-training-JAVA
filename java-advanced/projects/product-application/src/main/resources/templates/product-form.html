<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a th:href="@{/home}">Home</a>
            <a th:href="@{/list}">View Products</a>
            <a th:href="@{/add}">Add Product</a>
        </nav>
    </header>
    <div class="container">
        <h1>Add New Product</h1>
        <form th:action="@{/save}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" th:field="*{name}" id="name" placeholder="Enter product name">
                <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" step="0.01" th:field="*{price}" id="price" placeholder="0.00">
                <div class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" th:field="*{quantity}" id="quantity" placeholder="1">
                <div class="error-message" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
            </div>
            
            <div style="margin-top: 2rem;">
                <button type="submit" class="btn">Save Product</button>
                <a th:href="@{/list}" class="btn" style="background-color: transparent; color: var(--text-muted); font-weight: 400;">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
