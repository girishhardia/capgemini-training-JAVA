spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      routes:
        - id: user_route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user,/user/**
        - id: doctor_route
          uri: lb://DOCTOR-SERVICE
          predicates:
            - Path=/doctor,/doctor/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
